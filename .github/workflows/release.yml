name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          git show HEAD~1:package.json > /tmp/prev-package.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/prev-package.json
          PREVIOUS=$(node -p "require('/tmp/prev-package.json').version")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "VITE_APP_API_URL=${{ secrets.VITE_APP_API_URL }}" >> .env
          echo "VITE_IMAGES_BASE_URL=${{ secrets.VITE_IMAGES_BASE_URL }}" >> .env
          echo "VITE_APP_BASE_URL=${{ secrets.VITE_APP_BASE_URL }}" >> .env

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx electron-vite build

      # Build-check only. Real releases are built, SIGNED (Certum SimplySign),
      # and published from a local Windows machine via `npm run release`.
      # See RELEASING.md. CI never publishes because it has no signing cert,
      # and shipping unsigned installers would break auto-update + SmartScreen.
      - name: Package installer (no publish)
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact (for testing only)
        uses: actions/upload-artifact@v4
        with:
          name: boly-${{ needs.check-version.outputs.version }}-unsigned
          path: dist_new/boly-${{ needs.check-version.outputs.version }}-setup.exe
          if-no-files-found: error
